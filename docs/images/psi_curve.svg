<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380" viewBox="0 0 700 380">
  <style>
    .axis { stroke: #333; stroke-width:1; }
    .grid { stroke: #ddd; stroke-width:1; }
    .curve { fill:none; stroke:#d9480f; stroke-width:3; }
    .point { fill:#1f77b4; }
    .label { font-family: Arial, Helvetica, sans-serif; font-size:12px; fill:#111; }
    .title { font-family: Arial; font-size:14px; font-weight:bold; }
  </style>

  <!-- Axes and grid -->
  <rect x="0" y="0" width="700" height="380" fill="white" />
  <!-- drawable area margins -->
  <g transform="translate(60,20)">
    <rect width="520" height="300" fill="none" stroke="none"/>

    <!-- horizontal grid and y ticks -->
    <g class="grid">
      <line x1="0" y1="0" x2="520" y2="0" />
      <line x1="0" y1="60" x2="520" y2="60" />
      <line x1="0" y1="120" x2="520" y2="120" />
      <line x1="0" y1="180" x2="520" y2="180" />
      <line x1="0" y1="240" x2="520" y2="240" />
    </g>

    <!-- y-axis labels (psi) -->
    <g class="label">
      <text x="-40" y="6">0.4</text>
      <text x="-40" y="66">0.2</text>
      <text x="-40" y="126">0.0</text>
      <text x="-44" y="186">-0.5</text>
      <text x="-44" y="246">-1.0</text>
    </g>

    <!-- x-axis ticks and labels (b) -->
    <g class="label">
      <text x="0" y="320">0.5</text>
      <text x="80" y="320">1</text>
      <text x="140" y="320">1.5</text>
      <text x="200" y="320">2</text>
      <text x="260" y="320">e</text>
      <text x="330" y="320">4</text>
      <text x="390" y="320">6</text>
      <text x="520" y="320">10</text>
    </g>

    <!-- Axes lines -->
    <line class="axis" x1="0" y1="0" x2="0" y2="300" />
    <line class="axis" x1="0" y1="300" x2="520" y2="300" />

    <!-- The Psi(b) curve (sampled points mapped to drawable coords) -->
    <!-- Points computed for b = [0.5,1,1.5,2,2.718,4,6,10] -->
    <polyline class="curve" points="
      0,246
      87,71
      115,36
      142,27
      181,24
      252,27
      361,33
      520,41
    " />

    <!-- Mark the maximum at b = e -->
    <circle class="point" cx="181" cy="24" r="4" />
    <text class="label" x="190" y="18">(b = e, ψ = 1/e ≈ 0.368)</text>

    <!-- Axis titles -->
    <text class="label" x="240" y="340">Branching factor $b$</text>
    <text class="label" transform="translate(-58,150) rotate(-90)">Efficiency $\Psi(b)=\ln b / b$</text>

  </g>

  <!-- overall title and caption -->
  <text x="60" y="14" class="title">Efficiency function $\Psi(b)=\dfrac{\ln b}{b}$</text>
  <text x="60" y="360" class="label">Figure: Efficiency curve showing a unique maximum at $b=e\approx2.718$. Domain shown: $b\in[0.5,10]$.</text>
</svg>
